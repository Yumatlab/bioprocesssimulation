# Where the elements of the PCS tab sit.
#
# Copy this file next to your database as pcs.yaml and change it there; the
# application reads yours instead of this one and never writes to this file.
# In the running application: Settings → PCS layout…
#
# Positions are fractions of the sheet: [x, y], x from the left edge (0) to
# the right edge (1), y from the top (0) to the bottom (1). The sheet scales
# with the window.
#
# A pipe runs from the centre of the element it starts at, through its bends,
# to the centre of the element it ends at; the widgets cover the ends. A pipe
# that is not listed under pipes is drawn as a straight line. A valve sits
# where its position says — put it on its pipe.
#
# Every element has to appear once. If anything is wrong the application keeps
# a plain arrangement (the reactor in the middle, everything else around it)
# and says why in the log — it will not show half a sheet.
#
# Elements for a second reservoir may stay in the file for an organism with
# one; they are simply not drawn.
#
# The arrangement follows the R&I scheme (matlab/RI.drawio): the reservoirs
# stand in a row at the bottom, their lines rise like steps — the leftmost
# highest — so that no two lines cross, and the pumps stand in a column in
# front of the reactor.

elements:
  reactor:        [0.60, 0.56]
  stirrer:        [0.60, 0.13]  # on the shaft, which the sheet draws to the lid

  # Gas, top left: four supplies into one manifold, one main valve.
  air_supply:     [0.04, 0.08]
  air_valve:      [0.14, 0.08]
  o2_supply:      [0.04, 0.16]
  o2_valve:       [0.14, 0.16]
  n2_supply:      [0.04, 0.24]
  n2_valve:       [0.14, 0.24]
  co2_supply:     [0.04, 0.32]
  co2_valve:      [0.14, 0.32]
  gas_manifold:   [0.32, 0.20]
  aeration_valve: [0.43, 0.20]

  # Liquids: the vessels in a row at the bottom, the pumps in a column.
  antifoam:       [0.04, 0.89]
  alkali:         [0.12, 0.89]
  acid:           [0.20, 0.89]
  reservoir1:     [0.28, 0.89]
  reservoir2:     [0.36, 0.89]
  antifoam_pump:  [0.42, 0.420]
  alkali_pump:    [0.42, 0.485]
  acid_pump:      [0.42, 0.550]
  feed1_pump:     [0.42, 0.615]
  feed2_pump:     [0.42, 0.680]

  # Right: the jacket. Below: the harvest, out of the bottom of the reactor.
  cooling_supply: [0.94, 0.46]
  cooling_valve:  [0.82, 0.46]
  heating_supply: [0.94, 0.61]
  heating_valve:  [0.82, 0.61]
  harvest_valve:  [0.78, 0.89]
  harvest:        [0.94, 0.89]

pipes:
  air_line:      [[0.32, 0.08]]
  o2_line:       [[0.32, 0.16]]
  n2_line:       [[0.32, 0.24]]
  co2_line:      [[0.32, 0.32]]
  # No bends: the sheet runs it level from the manifold to above the gas
  # lance in the reactor's lid and straight down onto it. The reactor is
  # kept low enough for that.
  aeration_line: []
  # Up from the vessel to its own height, then right through the pump into
  # the reactor; the last bend lies inside the reactor, under its widget.
  antifoam_line: [[0.04, 0.420], [0.55, 0.420]]
  alkali_line:   [[0.12, 0.485], [0.55, 0.485]]
  acid_line:     [[0.20, 0.550], [0.55, 0.550]]
  feed1_line:    [[0.28, 0.615], [0.55, 0.615]]
  feed2_line:    [[0.36, 0.680], [0.55, 0.680]]
  cooling_line:  [[0.66, 0.46]]
  heating_line:  [[0.66, 0.61]]
  # Starts at the reactor's outlet nozzle, not at its centre: the sheet
  # drops it straight down to the height of the harvest vessel and runs it
  # level into the vessel's side — no bend near the arrow.
  harvest_line:  []
