name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Both installers on demand, from the Actions tab, without a release.
  # Testing a build has to come before tagging the version it belongs to;
  # tag-only meant tagging v3.0.0 to find out whether v3.0.0 runs on Windows.
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Named, not guessed. Without it setup-python looks for a
          # requirements.txt, this project has never had one, and the step
          # fails before anything is installed — on every runner alike.
          cache-dependency-path: python/pyproject.toml
      # Qt ships its own libraries but still links against the system's
      # graphics and keyboard ones, and a GitHub Linux runner carries
      # neither. QT_QPA_PLATFORM=offscreen does not help: the import fails
      # before a platform plugin is ever chosen. macOS and Windows bring
      # their equivalents with the operating system.
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      # The application lives in python/; only this file has to stay at the
      # top of the repository, because that is the only place GitHub looks
      # for it. Everything it runs happens one directory down.
      - run: pip install -e ".[dev]"
        working-directory: python
      - name: Lint
        run: ruff check .
        working-directory: python
      # Qt needs an off-screen platform plugin on the CI runners.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
        working-directory: python

  # Plan section 7.2: every tag produces both installers, so neither has to
  # be built by hand on a machine that happens to run the right system.
  # Also on request, so a build can be tried before it is tagged.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # For the provenance attestation below. Harmless where it does not run.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: build/windows.spec
            artefact: BiofermentationSimulation-windows
            asset: dist/BiofermentationSimulation.exe
          - os: macos-latest
            spec: build/macos.spec
            artefact: BiofermentationSimulation-macos
            asset: dist/BiofermentationSimulation-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[build]"
        working-directory: python
      - name: Build
        run: pyinstaller --noconfirm ${{ matrix.spec }}
        working-directory: python
      # **A .app is a directory, and an artefact is not.** upload-artifact
      # does not keep file permissions or symlinks, so uploading the bundle
      # as a tree hands the operator a few hundred loose files with the
      # executable bit stripped — and the release step then attaches every one
      # of them as its own asset. `ditto -c -k --keepParent` is macOS's own
      # archiver and the only one that keeps a bundle a bundle.
      - name: Pack the macOS bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Biofermentation Simulation.app" "${{ matrix.asset }}"
        working-directory: python
      # A build that produces a file which cannot start is worse than none.
      # The import is what the built file does first; the size is what says
      # PyInstaller actually put the interpreter and Qt inside it.
      - name: Smoke test the build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import biofermentation.gui.app"
        working-directory: python
      - name: The asset is there and is not empty
        shell: bash
        run: |
          size=$(wc -c < "${{ matrix.asset }}")
          echo "${{ matrix.asset }} is $size bytes"
          test "$size" -gt 20000000
        working-directory: python
      # Proof that this file was built from this commit, by GitHub, in this
      # workflow — which is a stronger statement than any signature this
      # project could afford. It needs a public repository (or Enterprise
      # Cloud); on a private one the step fails and must not take the release
      # with it, so it is allowed to fail and the checksums carry on alone.
      - name: Attest where this file came from
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: python/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: python/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      # download-artifact puts each one in a folder of its own; the release
      # wants the files themselves, and the checksum list wants them in one
      # directory so the names in it are the names somebody downloads.
      - name: Collect the files and check them off
        run: |
          mkdir -p release
          find artefacts -type f -exec mv {} release/ \;
          cd release
          # Written outside and moved in, so the list cannot end up containing
          # itself — which it does whenever the shell expands the glob after
          # the redirection has already created the file.
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          {
            echo "### Checksums (SHA-256)"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Neither build is signed: real signing costs a yearly Apple"
            echo "membership and a Windows certificate. Windows therefore warns"
            echo "about an unknown publisher and macOS refuses the first"
            echo "double-click — \`docs/installation.md\` says how to allow them,"
            echo "and how to compare the checksum above against the file you"
            echo "downloaded. That comparison is the statement that carries"
            echo "weight here, not the signature."
          } > ../body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: body.md
          generate_release_notes: true
